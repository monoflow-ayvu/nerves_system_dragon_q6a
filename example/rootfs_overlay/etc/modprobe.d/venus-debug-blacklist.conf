# Debug: suppress boot-time autoload of the venus VPU driver.
# The VPU ARM9 does not answer VIDC_CTRL_INIT when probed at ~5.5s
# (EDK2/ATE state not ready), leaving a half-probed device whose
# runtime-PM retries can stall the SoC. Load manually after boot:
#   modprobe venus-core
blacklist venus_core
blacklist venus_dec
blacklist venus_enc
