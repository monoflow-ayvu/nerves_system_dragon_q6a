# Belt-and-braces for the AIC8800D80 Bluetooth interface.
#
# The vendor aic_btusb driver and the in-tree btusb driver both match the
# AIC8800D80 BT interface (A69C:8D81, USB class e0/01/01): aic_btusb by an
# explicit id-table entry, btusb by the generic Bluetooth interface class.
# Whichever gets modprobed first claims the device, so BT silently works or
# does not depending on udev ordering.
#
# CONFIG_BT_HCIBTUSB is already unset in linux-dragon-q6a.fragment, so btusb
# should not exist at all. This blacklist keeps the guarantee if the kernel
# base config changes and quietly re-enables it. eudev's kmod builtin applies
# modprobe.d blacklists to modalias auto-load, which is how modules get loaded
# from qcom-coldplug.sh.
blacklist btusb
