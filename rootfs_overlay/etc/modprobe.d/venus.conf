# Qualcomm Venus VPU: suppress boot-time autoload.
#
# On this board (venus runs use_tz=false, no-TZ boot path) the VPU ARM9
# does not answer VIDC_CTRL_INIT when the driver probes at ~5.5 s after
# boot: the probe fails ("failed to reset venus core") and the
# half-probed device is unrecoverable until reboot. Load the driver
# later, on first use - it probes cleanly once the board is up:
#
#   modprobe venus-core
#   modprobe venus-dec
#   modprobe venus-enc
#
# (busybox modprobe loads one module per invocation.)
# A modprobe.d blacklist blocks autoload only; explicit modprobe works.
# See README.md "VPU (Qualcomm Venus)".
blacklist venus_core
blacklist venus_dec
blacklist venus_enc
