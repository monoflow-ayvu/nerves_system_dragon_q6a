# Firmware boot script for the Radxa Dragon Q6A (Qualcomm QCS6490)
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (BOOTAA64.EFI):
#
# boot linux fdt squash4 ext2 fat part_gpt part_msdos normal efi_gop loadenv
# echo test true search configfile regexp probe
#
# GRUB is loaded by the board's on-board Qualcomm UEFI firmware from the ESP
# (\EFI\BOOT\BOOTAA64.EFI), so $root points at the ESP. The rootfs slots are
# partitions 2 and 3 on the same disk. The kernel is stored inside each
# slot's squashfs at /boot, so kernel+rootfs upgrade atomically with the slot.
#
# DEVICE TREE: the board's EDK2 firmware in SPI NOR compiles the board DTS at
# build time and publishes the DTB to the OS through the EFI Configuration
# Table (EFI_DEVICE_TREE_GUID). We MUST use that one. On arm64 GRUB forwards
# the firmware FDT to the kernel automatically as long as no `devicetree`
# command is issued; `devicetree` does not merge, it REPLACES the firmware
# DTB wholesale and discards its runtime fixups - the memory map and
# reserved-memory carveouts that have to agree with what XBL/TZ already set
# up, plus DDR size/SKU differences. A mismatch does not fail cleanly: it
# surfaces as SMMU faults or ADSP/CDSP remoteproc load failures. The
# firmware DTB is also the only one carrying the simple-framebuffer node
# that simpledrm binds to.
#
# The proven vendor-equivalent Yocto image does the same thing - its
# systemd-boot Type 1 entries contain no devicetree line at all.
#
# The `fdt` module must stay compiled in regardless: grub-core/loader/efi/
# linux.c calls grub_fdt_load()/grub_fdt_install() unconditionally, so the
# `linux` command needs it even when we install no DTB of our own.
#
# The rootfs PARTUUID is probed at boot from the disk GRUB was loaded from,
# so the same image boots from microSD or USB - including when several of
# them hold a Nerves install at once (each medium must be burned with its
# own partition GUIDs; see README). Whichever disk the UEFI boot order picks
# supplies the kernel and the rootfs.

# Load the environment for the A/B slot selection
load_env

# A/B auto-rollback ("boot once" semantics):
#
#   validated=1               -> slot is known good, boot it unconditionally.
#   validated=0 booted_once=0 -> freshly written slot; give it exactly one
#                                try (mark booted_once=1 before booting).
#   validated=0 booted_once=1 -> the slot got its one try and nobody
#                                validated it (fwup validate/autovalidate),
#                                so it is considered bad: flip back to the
#                                other slot and mark it validated (it was
#                                the running slot when the upgrade was
#                                written, so it is known good).
#
# fwup's upgrade tasks write grubenv with validated=0 booted_once=0; the
# validate/autovalidate tasks in ops.fw write the *_valid variant. After a
# fallback, /usr/sbin/qcom-coldplug.sh reconciles nerves_fw_active in the
# uboot-env KV store with the slot that actually booted.
#
# save_env works here: grubenv is a preallocated 1 KiB GRUB environment
# block on the plain-FAT ESP, written in place.
if [ "$validated" != "1" ]; then
    if [ "$booted_once" = "1" ]; then
        if [ "$boot" = "1" ]; then
            set boot=0
        else
            set boot=1
        fi
        set validated=1
        save_env boot validated booted_once
        echo "Slot was not validated after its first boot - falling back!"
    else
        set booted_once=1
        save_env booted_once
    fi
fi

# Derive the disk grub was loaded from (e.g. "hd0,gpt1" -> "hd0") so that
# booting still works if the UEFI enumerates other disks first.
regexp --set=nerves_disk '^\(?([^,]+)' "$root"
if [ -z "$nerves_disk" ]; then
    set nerves_disk=hd0
fi

# Kernel command line. ttyMSM0 is the Q6A debug UART (115200n8).
# clk_ignore_unused/pd_ignore_unused are bring-up safety nets on Qualcomm
# platforms (avoid gating clocks/power-domains of not-yet-probed devices);
# revisit once the driver set is complete.
# net.ifnames=0 keeps eth0/wlan0: eudev's 80-net-name-slot.rules renames
# interfaces from the net_id builtin unless this is set. The proven Yocto
# boot entries carry it too.
# Two consoles, mirroring the proven Yocto boot entries
# (esp-qcom-image/q6a-a.conf): kernel messages go to BOTH the debug UART and
# the HDMI framebuffer console, and the LAST console= listed becomes
# /dev/console, so tty1 wins. This matters for bench work without a USB-TTL
# adapter: with ttyMSM0 alone the screen goes dark the moment GRUB hands over,
# which makes a SUCCESSFUL boot look identical to a silent MeasureBoot abort.
# HDMI output needs no extra config -- VT, VT_CONSOLE, FRAMEBUFFER_CONSOLE,
# DRM_FBDEV_EMULATION and DRM_SIMPLEDRM are all already =y in the merged
# .config, and SYSFB_SIMPLEFB=y makes simpledrm bind the EDK2 DTB's
# simple-framebuffer node.
# loglevel=7 (was 4) for bring-up: on a screen-only bench the info-level
# probe messages are the diagnosis. Lower it once the board is trusted.
set nerves_cmdline="console=ttyMSM0,115200n8 earlycon console=tty1 clk_ignore_unused pd_ignore_unused loglevel=7 rootfstype=squashfs rootwait ro net.ifnames=0"

# NOTE: no `devicetree` command here - see the DEVICE TREE note at the top.
# The kernel gets its DTB from the EDK2 firmware via the EFI configuration
# table. A reference copy of the DTB we build is kept at
# /usr/share/dtb/qcs6490-radxa-dragon-q6a.dtb inside each slot for bench
# comparison against /sys/firmware/devicetree/base; it is deliberately not
# on the boot path. If a board ever needs an override, edit this file on the
# ESP (plain FAT, mountable from any host) rather than adding one back here.

# Boot A or B depending on which one is active
if [ "$boot" = "1" ]; then
    probe --set=nerves_root_uuid --part-uuid ($nerves_disk,gpt3)
    echo "Booting slot B (root PARTUUID=$nerves_root_uuid)..."
    linux ($nerves_disk,gpt3)/boot/Image root=PARTUUID=$nerves_root_uuid $nerves_cmdline
else
    probe --set=nerves_root_uuid --part-uuid ($nerves_disk,gpt2)
    echo "Booting slot A (root PARTUUID=$nerves_root_uuid)..."
    linux ($nerves_disk,gpt2)/boot/Image root=PARTUUID=$nerves_root_uuid $nerves_cmdline
fi

# Boot!!!
boot
