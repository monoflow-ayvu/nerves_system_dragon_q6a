# Firmware boot script for the Radxa Dragon Q6A (Qualcomm QCS6490)
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (BOOTAA64.EFI):
#
# boot linux fdt squash4 ext2 fat part_gpt part_msdos normal efi_gop loadenv
# echo test true search configfile regexp probe
#
# GRUB is loaded by the board's on-board Qualcomm UEFI firmware from the ESP
# (\EFI\BOOT\BOOTAA64.EFI), so $root points at the ESP. The rootfs slots are
# partitions 2 and 3 on the same disk. The kernel and the board DTB are
# stored inside each slot's squashfs at /boot, so kernel+DTB+rootfs upgrade
# atomically with the slot.
#
# The Qualcomm UEFI does not hand the OS a usable device tree — the EFI
# payload must install it. We do that with GRUB's `devicetree` command
# (module `fdt`) before `linux`. NOTE: `devicetree` is disabled by GRUB
# when Secure Boot is active; Secure Boot must be off (it is on this board).
#
# The rootfs PARTUUID is probed at boot from the disk GRUB was loaded from,
# so the same image boots from microSD or USB — including when several of
# them hold a Nerves install at once (each medium must be burned with its
# own partition GUIDs; see README). Whichever disk the UEFI boot order picks
# supplies the kernel, the DTB and the rootfs.

# Load the environment for the A/B slot selection
load_env

# Derive the disk grub was loaded from (e.g. "hd0,gpt1" -> "hd0") so that
# booting still works if the UEFI enumerates other disks first.
regexp --set=nerves_disk '^\(?([^,]+)' "$root"
if [ -z "$nerves_disk" ]; then
    set nerves_disk=hd0
fi

# Kernel command line. ttyMSM0 is the Q6A debug UART (115200n8).
# clk_ignore_unused/pd_ignore_unused are bring-up safety nets on Qualcomm
# platforms (avoid gating clocks/power-domains of not-yet-probed devices);
# revisit once the driver set is complete.
set nerves_cmdline="console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused loglevel=4 rootfstype=squashfs rootwait ro"

set nerves_dtb="/boot/qcs6490-radxa-dragon-q6a.dtb"

# Boot A or B depending on which one is active
if [ "$boot" = "1" ]; then
    probe --set=nerves_root_uuid --part-uuid ($nerves_disk,gpt3)
    echo "Booting slot B (root PARTUUID=$nerves_root_uuid)..."
    devicetree ($nerves_disk,gpt3)$nerves_dtb
    linux ($nerves_disk,gpt3)/boot/Image root=PARTUUID=$nerves_root_uuid $nerves_cmdline
else
    probe --set=nerves_root_uuid --part-uuid ($nerves_disk,gpt2)
    echo "Booting slot A (root PARTUUID=$nerves_root_uuid)..."
    devicetree ($nerves_disk,gpt2)$nerves_dtb
    linux ($nerves_disk,gpt2)/boot/Image root=PARTUUID=$nerves_root_uuid $nerves_cmdline
fi

# Boot!!!
boot
