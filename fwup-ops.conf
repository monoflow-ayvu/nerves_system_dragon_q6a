# Post-installation firmware operations for the Radxa Dragon Q6A (QCS6490)
#
# Tasks include:
#
# * `factory-reset` - Clear out the writable filesystem and any other writable
#                   areas so that they can be re-initialized on the next boot.
# * `prevent-revert` - Prevent `revert` from working until the next firmware
# * `revert` - Revert to the previous firmware if it's still available
# * `validate` - Mark this firmware as validated so that it doesn't get
#                reverted automatically after an update.
# * `status` - Print out the partition that's active (`a` or `b`)
#
# To use:
#
# 1. Run `fwup -c -f fwup-ops.conf -o ops.fw` and copy ops.fw to
#    the device. This is done automatically as part of the Nerves system
#    build process. The file is stored in `/usr/share/fwup/ops.fw`.
# 2. On the device, run `fwup -t <task> -d /dev/rootdisk0 --enable-trim /usr/share/fwup/ops.fw`.
# 3. Reboot after running `revert` or `factory-reset`.
#
# It's critical that this is kept in sync with the main fwup.conf.

require-fwup-version="1.0.0"

#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
# Run 'fwup -m' to query values in a .fw file.
# Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "dragon_q6a")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Fernando Mumbach")

# Disk layout - must match fwup.conf
#
# +----------------------------+
# | Protective MBR + GPT       |
# +----------------------------+
# | Firmware config data       | LBA 64-79 (u-boot env format KV store)
# +----------------------------+
# | p1: ESP "boot" (FAT32)     |
# +----------------------------+
# | p2: Rootfs A (squashfs)    |
# +----------------------------+
# | p3: Rootfs B (squashfs)    |
# +----------------------------+
# | p4: Application (ext4)     |
# +----------------------------+

define(UBOOT_ENV_OFFSET, 64)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

define(BOOT_PART_OFFSET, 2048)
define(BOOT_PART_COUNT, 524288)  # 256 MiB, FAT32 - must match fwup.conf

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 4194304)  # 2 GiB (kernel+NPU userspace/QAIRT) - must match fwup.conf
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)  # 512 MiB minimum

# Firmware archive metadata
meta-product = "${NERVES_FW_PRODUCT} post-install operations"
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

file-resource grubenv_a_valid {
    host-path = "${NERVES_SYSTEM}/images/grubenv_a_valid"
}
file-resource grubenv_b_valid {
    host-path = "${NERVES_SYSTEM}/images/grubenv_b_valid"
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

##
# factory-reset
##
task factory-reset {
    on-init {
        info("Erasing all writable data")
        # This requires --enable-trim
        trim(${APP_PART_OFFSET}, ${APP_PART_COUNT})
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

##
# prevent-revert
#
# Pass `--enable-trim` to also clear out the partition that no longer should be used.
##
task prevent-revert.a {
    # Check that we're running on B
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    on-init {
        info("Preventing reverts to partition A")
        # Remove U-Boot variables that fwup uses to allow reverting images
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        # Clear out the old image using TRIM. This requires --enable-trim
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }
}
task prevent-revert.b {
    # Check that we're running on A
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    on-init {
        info("Preventing reverts to partition B")
        # Remove U-Boot variables that fwup uses to allow reverting images
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        # Clear out the old image using TRIM. This requires --enable-trim
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }
}
task prevent-revert.fail {
    on-init {
        error("Error detecting active partition")
    }
}

##
# revert
##
task revert.a {
    # This task reverts to the A partition, so check that we're running on B
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Verify that partition A has the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-resource grubenv_a_valid {
        info("Reverting to partition A")

        # Switch over. The revert target ran before, so it is known good:
        # write the pre-validated grubenv so GRUB doesn't treat it as a
        # one-shot trial slot.
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}

task revert.b {
    # This task reverts to the B partition, so check that we're running on A
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    # Verify that partition B has the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-resource grubenv_b_valid {
        info("Reverting to partition B")

        # Switch over. The revert target ran before, so it is known good:
        # write the pre-validated grubenv so GRUB doesn't treat it as a
        # one-shot trial slot.
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}

task revert.unexpected.a {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where A is good, and the desire is to go to B.
        error("It doesn't look like there's anything to revert to in partition B.")
    }
}
task revert.unexpected.b {
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where B is good, and the desire is to go to A.
        error("It doesn't look like there's anything to revert to in partition A.")
    }
}
task revert.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

##
# status
#
# Run "fwup /usr/share/fwup/ops.fw -t status -d /dev/rootdisk0 -q -U" to check the status.
##
task status.aa {
    require-path-on-device("/", "/dev/rootdisk0p2")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("a") }
}
task status.ab {
    require-path-on-device("/", "/dev/rootdisk0p2")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("a->b") }
}
task status.bb {
    require-path-on-device("/", "/dev/rootdisk0p3")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("b") }
}
task status.ba {
    require-path-on-device("/", "/dev/rootdisk0p3")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("b->a") }
}
task status.fail {
    on-init { error("fail") }
}

##
# validate
#
# Marks the currently active slot as good: writes the pre-validated grubenv
# for the active slot to the ESP (so GRUB stops treating it as a one-shot
# trial slot; see grub.cfg) and sets nerves_fw_validated=1 for
# Nerves.Runtime.validate_firmware/0 & friends. fwup matches tasks by
# prefix, so `-t validate` picks validate.a or validate.b.
##
task validate.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init {
        info("Validating slot A")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
    on-resource grubenv_a_valid {
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}
task validate.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init {
        info("Validating slot B")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
    on-resource grubenv_b_valid {
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}
task validate.fail {
    on-init {
        error("Error detecting active partition")
    }
}

##
# reconcile
#
# Run once at boot (qcom-coldplug.sh). If GRUB auto-fell-back to the other
# slot (grub.cfg flips `boot` when a slot misses its validation window),
# the uboot-env's nerves_fw_active still names the failed slot; sync it
# with the slot that actually mounted /. Safe to run every boot: a pending
# not-yet-rebooted upgrade cannot look like a mismatch at boot time.
##
task reconcile.a {
    # Running from A but the env says B => GRUB fell back to A.
    require-path-on-device("/", "/dev/rootdisk0p2")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init {
        info("GRUB fell back to slot A; reconciling firmware state")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}
task reconcile.b {
    # Running from B but the env says A => GRUB fell back to B.
    require-path-on-device("/", "/dev/rootdisk0p3")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init {
        info("GRUB fell back to slot B; reconciling firmware state")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}
task reconcile.ok {
    on-init {
        info("Firmware state consistent")
    }
}

##
# autovalidate
#
# Run at boot after reconcile (qcom-coldplug.sh). When
# nerves_fw_autovalidate=1 (the shipped default) a freshly upgraded slot
# that boots far enough to reach the pre-run hook validates itself. Set
# nerves_fw_autovalidate=0 (e.g. for NervesHub-managed devices) to require
# an explicit Nerves.Runtime.validate_firmware/0 instead.
##
task autovalidate.a {
    require-uboot-variable(uboot-env, "nerves_fw_autovalidate", "1")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init {
        info("Auto-validating slot A")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
    on-resource grubenv_a_valid {
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}
task autovalidate.b {
    require-uboot-variable(uboot-env, "nerves_fw_autovalidate", "1")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init {
        info("Auto-validating slot B")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
    on-resource grubenv_b_valid {
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }
}
task autovalidate.skip {
    on-init {
        info("No auto-validation needed")
    }
}
