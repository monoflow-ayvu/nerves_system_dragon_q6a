name: CI

on: [push]

env:
  OTP_VERSION: 28.0.1
  ELIXIR_VERSION: 1.18.4-otp-28
  NERVES_BOOTSTRAP_VERSION: 1.13.1
  FWUP_VERSION: 1.13.1  # matches Dockerfile; used by the qemu-smoke job

permissions:
  id-token: write
  contents: read

jobs:
  get-br-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: gridpoint-com/actions-nerves-system@v1
      - name: Get Buildroot Dependencies
        uses: ./.actions/get-br-dependencies
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
          push-to-download-site: false

  build-system:
    needs: [get-br-dependencies]
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      # needed for the docker nerves build runner
      - run: mkdir -p /home/runner/.ssh
      - uses: actions/checkout@v4
      - uses: gridpoint-com/actions-nerves-system@v1
      # The Nerves Docker build_runner (mix.exs) pulls fermuch/nerves-dragon-q6a-builder
      # from Docker Hub (public), same as nerves_system_sg2002 does with its image.
      - name: Build nerves_system
        uses: ./.actions/build-system
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}

  qemu-smoke:
    needs: [build-system]
    runs-on: ubuntu-22.04
    # Force the Nerves download dir to a known path (default is XDG-dependent:
    # $XDG_DATA_HOME/nerves/dl or ~/.nerves/dl). We seed the prebuilt tarball
    # here so Nerves' resolver finds and caches it instead of rebuilding.
    env:
      NERVES_DL_DIR: /home/runner/nerves-dl
    steps:
      - uses: actions/checkout@v4
      - uses: gridpoint-com/actions-nerves-system@v1
      - uses: ./.actions/.internal/setup-beam-nerves
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
      # Reuse the system built by build-system instead of rebuilding buildroot
      # (~2h). Restore its deploy/system cache; the tarball there is named with
      # Nerves' download_name, so dropping it in NERVES_DL_DIR lets Nerves'
      # artifact resolver validate it and populate its cache itself (it writes
      # the CHECKSUM file that Cache.valid? checks).
      - name: Restore built system artifact
        uses: actions/cache/restore@v4
        with:
          path: deploy/system
          key: deploy/system-${{ github.sha }}-${{ github.ref_name }}
          fail-on-cache-miss: true
      - name: Seed prebuilt system into the Nerves download cache
        run: |
          set -euo pipefail
          mkdir -p "$NERVES_DL_DIR" "$HOME/.ssh"
          cp deploy/system/artifacts/nerves_system_dragon_q6a-portable-*.tar.gz "$NERVES_DL_DIR/"
          ls -la "$NERVES_DL_DIR"
      - name: Verify prebuilt resolves (fail fast instead of a 2h rebuild)
        run: |
          set -euo pipefail
          cd example
          export MIX_TARGET=dragon_q6a
          mix deps.get
          out="$(mix nerves.artifact.get 2>&1)"; echo "$out"
          if echo "$out" | grep -qE "nerves_system_dragon_q6a not found|Starting Build|Trying to pull image"; then
            echo "::error::Prebuilt system did not resolve from the seeded tarball; \
          the smoke build would rebuild buildroot from source. Aborting."
            exit 1
          fi
      - name: Install QEMU smoke-test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 mtools
          # fwup isn't in the Ubuntu repos; install the release .deb (same
          # version the builder image uses).
          curl -fsSL -o /tmp/fwup.deb \
            https://github.com/fwup-home/fwup/releases/download/v${FWUP_VERSION}/fwup_${FWUP_VERSION}_amd64.deb
          sudo apt-get install -y /tmp/fwup.deb
      - name: QEMU boot smoke test
        run: BOOT_TIMEOUT=300 EDK2_CODE=/usr/share/AAVMF/AAVMF_CODE.fd ./test/qemu-smoke.sh

  deploy-system:
    # Gate the release on a green build AND a successful QEMU boot.
    needs: [build-system, qemu-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gridpoint-com/actions-nerves-system@v1
      - name: Deploy nerves_system
        uses: ./.actions/deploy-system
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
