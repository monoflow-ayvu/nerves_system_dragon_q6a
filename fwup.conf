# Firmware configuration file for the Radxa Dragon Q6A (Qualcomm QCS6490)
#
# The board boots via its on-board Qualcomm UEFI firmware (QSPI NOR:
# PBL -> XBL -> UEFI), which loads \EFI\BOOT\BOOTAA64.EFI from the ESP.
# We put GRUB (arm64-efi, built by Buildroot) there. GRUB reads
# /EFI/BOOT/grubenv to pick the A or B slot and loads the kernel from
# *inside* the slot's squashfs (/boot/Image), so kernel+rootfs always
# upgrade atomically. The DTB is supplied by the SPI-NOR EDK2 firmware via
# the EFI configuration table - grub.cfg installs none.

# 1.14.0 is where "U-Boot environment blocks can now be written to offsets
# beyond 2 GB" landed. Our env block sits at LBA 64 (first on disk) so it can
# never hit that bug, but the floor is declared so a future layout change
# cannot silently reintroduce it. Buildroot ships fwup 1.16.0 on target.
require-fwup-version="1.14.0"

#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
# Run 'fwup -m' to query values in a .fw file.
# Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "dragon_q6a")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Fernando Mumbach")

# /dev/rootdisk* paths are provided by erlinit and refer to the disk
# partitions on the drive that provides the rootfs.
define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p4") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Disk layout (512-byte blocks)
#
# +----------------------------+
# | Protective MBR + GPT       | LBA 0-33
# +----------------------------+
# | Firmware config data       | LBA 64-79 (u-boot env format KV store,
# | (not in any partition)     |            not visible in the GPT)
# +----------------------------+
# | p1: ESP "boot" (FAT32)     | LBA 2048, 256 MiB: BOOTAA64.EFI, grub.cfg, grubenv
# +----------------------------+
# | p2: Rootfs A (squashfs)    | 4 GiB, kernel at /boot inside
# +----------------------------+
# | p3: Rootfs B (squashfs)    | 4 GiB
# +----------------------------+
# | p4: Application (ext4)     | 512 MiB+, expands to fill the disk
# +----------------------------+

define(UBOOT_ENV_OFFSET, 64)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

define(BOOT_PART_OFFSET, 2048)
# 256 MiB. Two reasons this is not 32 MiB:
#   1. UEFI 2.x 13.3.1 requires FAT32 for the ESP on FIXED media (FAT12/16
#      is only mandated for removable). fwup's fat_mkfs picks FAT16 at
#      32 MiB and FAT32 from ~48 MiB up (FatFs switches once the cluster
#      count exceeds 65525). A spec-following EDK2 on fixed eMMC/UFS/NVMe
#      may simply not see a FAT16 ESP. QEMU's FatPkg mounts FAT16 happily,
#      which is why our tests never caught this.
#   2. Headroom for the systemd-boot fallback (see PORTING-FROM-YOCTO.md
#      B6): that path needs two kernels on the ESP. Growing the ESP later
#      shifts every partition, i.e. a re-flash of every deployed board -
#      not an OTA - so it is sized once, generously.
define(BOOT_PART_COUNT, 524288)  # 256 MiB, FAT32

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 8388608)  # 4 GiB (kernel+NPU userspace/QAIRT)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)  # 512 MiB minimum; expands to fill the disk
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

# Default partition GUIDs. grub.cfg does not depend on these values (it
# probes the boot disk's PARTUUID at boot time), but every medium in the
# same machine must have UNIQUE GUIDs or root=PARTUUID becomes ambiguous.
# All define()s can be overridden with environment variables of the same
# name at burn time - use install-to-disk.sh to burn an additional medium
# with freshly generated GUIDs.
define(DISK_GUID, "b849d37d-b427-4b7e-8445-05b444718b42")
define(ESP_TYPE_GUID, "c12a7328-f81f-11d2-ba4b-00a0c93ec93b")
define(LINUX_TYPE_GUID, "0fc63daf-8483-4772-8e79-3d69d8477de4")
define(BOOT_PART_GUID, "b7cfa09c-ca7e-4cc1-a52a-0b32e9b2705e")
define(ROOTFS_A_PART_GUID, "f784fad8-2d26-4df0-88a8-27864150c21b")
define(ROOTFS_B_PART_GUID, "dbae00a5-5847-43a4-87cf-2b79631085e7")
define(APP_PART_GUID, "34d432ec-6782-4491-9316-f73d3aeb5767")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

file-resource bootaa64.efi {
    host-path = "${NERVES_SYSTEM}/images/bootaa64.efi"
}
file-resource grub.cfg {
    host-path = "${NERVES_SYSTEM}/images/grub.cfg"
}

# It's important to order the rootfs image before the grub environment
# resources so that the grub environment blobs get written last. This
# protects against the case where an update is aborted midway.
file-resource rootfs.img {
    host-path = ${ROOTFS}

    # Error out if the rootfs size exceeds the partition size
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}
file-resource grubenv_a_valid {
    host-path = "${NERVES_SYSTEM}/images/grubenv_a_valid"
}
file-resource grubenv_a {
    host-path = "${NERVES_SYSTEM}/images/grubenv_a"
}
file-resource grubenv_b {
    host-path = "${NERVES_SYSTEM}/images/grubenv_b"
}

gpt gpt {
    guid = ${DISK_GUID}

    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = ${ESP_TYPE_GUID}
        guid = ${BOOT_PART_GUID}
        name = "boot"
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_TYPE_GUID}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs.a"
    }
    partition 2 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_TYPE_GUID}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs.b"
    }
    partition 3 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_TYPE_GUID}
        guid = ${APP_PART_GUID}
        name = "app"
        expand = true
    }
}

# Location where installed firmware information is stored.
# While this is called "u-boot", u-boot isn't involved in this
# setup. It just provides a convenient key/value store format.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# This firmware task writes everything to the destination media.
# This should only be run for the first installation.
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)

        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_mkdir(${BOOT_PART_OFFSET}, "/EFI")
        fat_mkdir(${BOOT_PART_OFFSET}, "/EFI/BOOT")

        uboot_clearenv(uboot-env)

        include("${NERVES_PROVISIONING}")

        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        # The factory image ships pre-validated (grubenv_a_valid below).
        #
        # nerves_fw_autovalidate=0 is the default on purpose. When it was 1,
        # qcom-coldplug.sh validated a freshly upgraded slot BEFORE the BEAM
        # started, so the bar was only "the kernel booted and erlinit ran" -
        # a release that crash-looped was marked good and GRUB would boot it
        # forever. Validation is now the application's job:
        # Nerves.Runtime.StartupGuard waits for every expected OTP
        # application to start and then calls validate_firmware/0
        # (see example/config/target.exs).
        #
        # Set this to "1" for a headless/kiosk image that has no
        # application-layer health signal; qcom-coldplug.sh will then
        # validate on first successful boot as before.
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_autovalidate", "0")
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    on-resource bootaa64.efi { fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/BOOTAA64.EFI") }
    on-resource grub.cfg { fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grub.cfg") }
    on-resource grubenv_a_valid { fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv") }

    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
      # Clear out any old data in the B partition that might be mistaken for
      # a file system. This is mostly to avoid confusion in humans when
      # reprogramming SDCards with unknown contents.
      raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

      # Invalidate the application data partition so that it is guaranteed to
      # trigger the corrupt filesystem detection code on first boot and get
      # formatted.
      raw_memset(${APP_PART_OFFSET}, 256, 0xff)

      # If writing to a file, make sure that the image is long enough. This is
      # needed for qemu and loopback testing.
      raw_memset(${APP_PART_LAST_OFFSET}, 1, 0xff)
    }
}

task upgrade.a {
    # This task upgrades the A partition, so make sure we're running
    # on B.
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Refuse to upgrade while the RUNNING slot is still an unvalidated
    # trial. Otherwise we overwrite the only known-good slot with a second
    # unproven image: both slots end up unvalidated and the GRUB boot-once
    # fallback has nothing good to fall back to. Matches the proven Yocto
    # fwup tasks. Falls through to upgrade.unvalidated.* below.
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition A")

        # Clear some firmware information just in case this update gets
        # interrupted midway. If this partition was bootable, it's not going to
        # be soon.
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")

        # Indicate that the entire partition can be cleared
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    # The last step is to switch over to the A partition
    on-resource grubenv_a {
        # Update firmware metadata
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Switch over to boot the new firmware. grubenv_a has validated=0
        # booted_once=0, so GRUB gives the new slot exactly one boot to get
        # validated (see grub.cfg) before falling back to B.
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }

    on-finish {
    }

    on-error {
    }
}

task upgrade.b {
    # This task upgrades the B partition, so make sure we're running
    # on A.
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    # See upgrade.a: never overwrite the last known-good slot while the
    # running one is an unvalidated trial.
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition B")

        # Clear some firmware information just in case this update gets
        # interrupted midway.
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")

        # Indicate that the entire partition can be cleared
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    # The last step is to switch over to the B partition
    on-resource grubenv_b {
        # Update firmware metadata
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Switch over to boot the new firmware. grubenv_b has validated=0
        # booted_once=0, so GRUB gives the new slot exactly one boot to get
        # validated (see grub.cfg) before falling back to A.
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/grubenv")
    }

    on-finish {
    }

    on-error {
    }
}

# If upgrade.a/upgrade.b were skipped because the running slot is an
# unvalidated trial, say so plainly. These must come BEFORE
# upgrade.unexpected, whose "neither A nor B is active" message would
# otherwise be badly misleading.
#
# Gate on nerves_fw_active rather than on nerves_fw_validated="0":
# require-uboot-variable also fails on a MISSING variable, so a wiped or
# pre-0.6 KV store would skip these too and fall through to the wrong error.
task upgrade.unvalidated.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init {
        error("Refusing to upgrade: the running firmware is not validated (nerves_fw_validated != 1). Validate it with Nerves.Runtime.validate_firmware/0, or reboot to let the GRUB boot-once rollback complete.")
    }
}

task upgrade.unvalidated.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init {
        error("Refusing to upgrade: the running firmware is not validated (nerves_fw_validated != 1). Validate it with Nerves.Runtime.validate_firmware/0, or reboot to let the GRUB boot-once rollback complete.")
    }
}

task upgrade.unexpected {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B partitions are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
